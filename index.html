<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para meu amor ❤️</title>
    <style>
        body {
            background-color: #ffeef2;
            font-family: 'Quicksand', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            overflow-x: hidden;
            text-align: center;
        }

        h1 { color: #d63384; margin-top: 30px; font-size: 1.8em; }

        /* Chuva de Corações */
        .heart {
            position: fixed;
            top: -10vh;
            font-size: 20px;
            color: #ff4d6d;
            user-select: none;
            z-index: 1000;
            animation: fall 3s linear forwards;
        }

        @keyframes fall {
            to { transform: translateY(110vh) translateX(20px); opacity: 0; }
        }

        /* Galeria Polaroid */
        .gallery {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            padding: 20px;
            width: 90%;
        }

        .polaroid {
            background: white;
            padding: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            transform: rotate(var(--r));
            transition: 0.3s;
        }

        .polaroid img {
            width: 100%;
            height: 150px;
            object-fit: cover;
        }

        .polaroid p {
            margin: 10px 0 0;
            font-size: 0.8em;
            color: #555;
            font-family: 'Dancing Script', cursive;
        }

        /* Jogo do Botão */
        .quiz-container {
            margin: 40px 0;
            padding: 20px;
            background: white;
            border-radius: 20px;
            width: 85%;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            position: relative;
        }

        .btns {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
            height: 100px;
        }

        button {
            padding: 15px 30px;
            font-size: 1.2em;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: 0.2s;
        }

        #btnSim { background-color: #ff4d6d; color: white; }

        #btnNao {
            background-color: #888;
            color: white;
            position: absolute;
        }

        /* Mensagem Final */
        #mensagemFinal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.95);
            z-index: 2000;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        #mensagemFinal h2 { color: #d63384; font-size: 2em; }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script&family=Quicksand:wght@500&display=swap" rel="stylesheet">
</head>
<body>

    <h1>Para a pessoa mais especial do mundo ❤️</h1>

    <div class="gallery">
        <div class="polaroid" style="--r: -3deg">
            <img src="foto1.jpg" alt="Nós dois">
            <p>Nosso rolê favorito! ❤️</p>
        </div>
        <div class="polaroid" style="--r: 2deg">
            <img src="foto2.jpg" alt="Você linda">
            <p>Você brilha mais que o sol! 🌹</p>
        </div>
        <div class="polaroid" style="--r: -2deg">
            <img src="foto3.jpg" alt="Selfie">
            <p>Cada segundo com você é único...</p>
        </div>
        <div class="polaroid" style="--r: 4deg">
            <img src="foto4.jpg" alt="Amor">
            <p>Meu lugar favorito é ao seu lado!</p>
        </div>
    </div>

    <div class="quiz-container">
        <h3>Você me ama, meu amor? 😍</h3>
        <div class="btns">
            <button id="btnSim" onclick="ganhou()">SIM!</button>
            <button id="btnNao" onmouseover="foge()" onclick="foge()">NÃO</button>
        </div>
    </div>

    <div id="mensagemFinal">
        <h2>Ebaaa! Eu também te amo MUITO! ❤️</h2>
        <p>Você é a melhor namorada que eu poderia ter. Obrigado por ser minha! 💍✨</p>
        <button onclick="document.getElementById('mensagemFinal').style.display='none'" style="background:#ff4d6d; color:white;">Fechar</button>
    </div>

    <script>
        // Criar corações caindo
        setInterval(() => {
            const heart = document.createElement('div');
            heart.classList.add('heart');
            heart.innerText = '❤️';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = Math.random() * 2 + 3 + 's';
            document.body.appendChild(heart);
            setTimeout(() => heart.remove(), 4000);
        }, 300);

        // Fazer o botão fugir
        function foge() {
            const btnNao = document.getElementById('btnNao');
            const width = window.innerWidth - 100;
            const height = window.innerHeight - 100;
            
            const newX = Math.random() * width;
            const newY = Math.random() * height;
            
            btnNao.style.left = newX + 'px';
            btnNao.style.top = newY + 'px';
        }

        // Quando clicar no SIM
        function ganhou() {
            document.getElementById('mensagemFinal').style.display = 'flex';
            // Efeito básico de confete seria legal aqui, mas o coração já dá o clima!
        }
    </script>
</body>
</html>
